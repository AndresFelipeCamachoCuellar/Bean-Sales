name: Build, publish and deploy to MonsterASP.NET

# Despliegue continuo hacia MonsterASP.NET (site81000 / kingbean.runasp.net) vía Web Deploy (MSDeploy).
# Método oficial documentado por MonsterASP:
#   https://help.monsterasp.net/books/github/page/how-to-deploy-website-via-github-actions
#
# Se dispara al hacer push a la rama `qa` (es decir, al mergear un PR hacia `qa`),
# y también manualmente desde la pestaña Actions de GitHub (workflow_dispatch).
# `dev` es la rama de trabajo; `qa` es la que publica en el sitio.
#
# IMPORTANTE: MonsterASP corre el app pool en 32 bits (.NET [x86]), por eso se
# publica con --runtime win-x86. La connection string de producción se inyecta
# en tiempo de build desde el secret MONSTERASP_CONNECTION_STRING (nunca vive en el repo).

on:
  push:
    branches:
      - qa
  workflow_dispatch:

jobs:
  build_and_deploy:
    # Debe ser Windows: el deploy usa Microsoft Web Deploy (MSDeploy), que solo corre en Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias (RID win-x86)
        run: dotnet restore Web/Web.csproj -r win-x86

      - name: Publicar (Release, framework-dependent x86)
        # win-x86 porque MonsterASP usa app pool de 32 bits. Framework-dependent
        # (--self-contained false) porque el host ya trae el runtime de .NET 10.
        # Salida ./publish = source-path por defecto de la action de deploy.
        run: dotnet publish Web/Web.csproj -c Release -o ./publish --runtime win-x86 --self-contained false --no-restore

      - name: Inyectar secretos de producción (BD, envío, pagos e imágenes)
        # Sobrescribe SOLO la DefaultConnection y la configuración de envío dentro del
        # appsettings.json publicado, tomando los valores de los secrets (nunca se
        # commitean). Se modifica el base appsettings.json para que aplique sin
        # depender del entorno del host.
        #
        # La parte de envío es DEFENSIVA: si el secret está vacío o la sección Shipping
        # no existe, no se toca nada y el sitio sigue con la tarifa fija de respaldo.
        #
        # La parte de PAGOS es igual de defensiva: si faltan las llaves de Wompi, la
        # sección queda vacía y el checkout confirma pedidos sin cobrar (comportamiento
        # anterior), en vez de romper el sitio.
        #
        # La parte de IMÁGENES (Cloudinary) también: sin las 3 credenciales el gestor de
        # fotos queda en modo lectura y el catálogo usa el patrón de respaldo.
        shell: pwsh
        env:
          PROD_CS: ${{ secrets.MONSTERASP_CONNECTION_STRING }}
          MIPAQUETE_CUSTOMER_KEY: ${{ secrets.MIPAQUETE_CUSTOMER_KEY }}
          MIPAQUETE_API_KEY: ${{ secrets.MIPAQUETE_API_KEY }}
          SHIPPING_ORIGIN_DANE: ${{ secrets.SHIPPING_ORIGIN_DANE }}
          SHIPPING_ORIGIN_CITY: ${{ secrets.SHIPPING_ORIGIN_CITY }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_BASE_URL: ${{ secrets.WOMPI_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          $path = "./publish/appsettings.json"
          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $cfg.ConnectionStrings.DefaultConnection = $env:PROD_CS
          Write-Host "Connection string de producción inyectada en appsettings.json."

          if ($cfg.PSObject.Properties.Name -contains 'Shipping') {
            # La credencial que exige /routes/quoteShipping es la CUSTOMER KEY (UUID del
            # comercio, header "customer-key"), NO el JWT. Por eso el proveedor dinámico
            # se activa con MIPAQUETE_CUSTOMER_KEY; la API key se inyecta si existe, pero
            # ya no manda (queda para los endpoints de guía/tracking de v1.1).
            if ($cfg.Shipping.PSObject.Properties.Name -contains 'Mipaquete') {
              if (-not [string]::IsNullOrWhiteSpace($env:MIPAQUETE_CUSTOMER_KEY)) {
                $cfg.Shipping.Mipaquete.CustomerKey = $env:MIPAQUETE_CUSTOMER_KEY
                $cfg.Shipping.Provider = 'Mipaquete'
                Write-Host "Customer key de Mipaquete inyectada. Shipping:Provider = Mipaquete."
              } else {
                Write-Host "Sin MIPAQUETE_CUSTOMER_KEY: se conserva Shipping:Provider = Fixed."
              }

              if (-not [string]::IsNullOrWhiteSpace($env:MIPAQUETE_API_KEY)) {
                $cfg.Shipping.Mipaquete.ApiKey = $env:MIPAQUETE_API_KEY
                Write-Host "API key de Mipaquete inyectada (no se usa al cotizar)."
              }
            } else {
              Write-Host "appsettings.json sin seccion Shipping:Mipaquete: se omite la inyeccion de credenciales de envio."
            }

            if ($cfg.Shipping.PSObject.Properties.Name -contains 'Origin') {
              if (-not [string]::IsNullOrWhiteSpace($env:SHIPPING_ORIGIN_DANE)) {
                $cfg.Shipping.Origin.DaneCode = $env:SHIPPING_ORIGIN_DANE
                Write-Host "Origen de envío (DANE) inyectado."
              }
              if (-not [string]::IsNullOrWhiteSpace($env:SHIPPING_ORIGIN_CITY)) {
                $cfg.Shipping.Origin.CityName = $env:SHIPPING_ORIGIN_CITY
                Write-Host "Origen de envío (ciudad) inyectado."
              }
            }
          } else {
            Write-Host "appsettings.json sin sección Shipping: se omite la inyección de envío."
          }

          # ---- Pagos (Wompi) ----
          # Los 4 secretos son independientes: se inyecta cada uno solo si viene cargado.
          # NUNCA se imprime el valor de una llave, solo si se inyectó.
          if ($cfg.PSObject.Properties.Name -contains 'Wompi') {
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_PUBLIC_KEY)) {
              $cfg.Wompi.PublicKey = $env:WOMPI_PUBLIC_KEY
              Write-Host "Wompi: llave pública inyectada."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_PRIVATE_KEY)) {
              $cfg.Wompi.PrivateKey = $env:WOMPI_PRIVATE_KEY
              Write-Host "Wompi: llave privada inyectada."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_INTEGRITY_SECRET)) {
              $cfg.Wompi.IntegritySecret = $env:WOMPI_INTEGRITY_SECRET
              Write-Host "Wompi: secreto de integridad inyectado."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_EVENTS_SECRET)) {
              $cfg.Wompi.EventsSecret = $env:WOMPI_EVENTS_SECRET
              Write-Host "Wompi: secreto de eventos inyectado."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_ENVIRONMENT)) {
              $cfg.Wompi.Environment = $env:WOMPI_ENVIRONMENT
              Write-Host "Wompi: ambiente = $env:WOMPI_ENVIRONMENT."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WOMPI_BASE_URL)) {
              $cfg.Wompi.BaseUrl = $env:WOMPI_BASE_URL
              Write-Host "Wompi: URL base del API inyectada."
            }

            if ([string]::IsNullOrWhiteSpace($env:WOMPI_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:WOMPI_INTEGRITY_SECRET)) {
              Write-Host "Wompi SIN llaves completas: el checkout seguirá confirmando pedidos sin cobrar."
            }
          } else {
            Write-Host "appsettings.json sin sección Wompi: se omite la inyección de pagos."
          }

          # ---- Imágenes de producto (Cloudinary) ----
          # CloudName y ApiKey NO son secretos (viajan al navegador por diseño), pero se
          # manejan como secrets por comodidad operativa y para no volver a tener
          # credenciales en el repo. ApiSecret SÍ es secreto: jamás se imprime.
          if ($cfg.PSObject.Properties.Name -contains 'Cloudinary') {
            if (-not [string]::IsNullOrWhiteSpace($env:CLOUDINARY_CLOUD_NAME)) {
              $cfg.Cloudinary.CloudName = $env:CLOUDINARY_CLOUD_NAME
              Write-Host "Cloudinary: cloud name inyectado."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:CLOUDINARY_API_KEY)) {
              $cfg.Cloudinary.ApiKey = $env:CLOUDINARY_API_KEY
              Write-Host "Cloudinary: API key inyectada."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:CLOUDINARY_API_SECRET)) {
              $cfg.Cloudinary.ApiSecret = $env:CLOUDINARY_API_SECRET
              Write-Host "Cloudinary: API secret inyectado."
            }

            if ([string]::IsNullOrWhiteSpace($env:CLOUDINARY_CLOUD_NAME) -or `
                [string]::IsNullOrWhiteSpace($env:CLOUDINARY_API_KEY) -or `
                [string]::IsNullOrWhiteSpace($env:CLOUDINARY_API_SECRET)) {
              Write-Host "Cloudinary SIN credenciales completas: el gestor de fotos quedara deshabilitado (el sitio despliega igual)."
            }
          } else {
            Write-Host "appsettings.json sin seccion Cloudinary: se omite la inyeccion de imagenes."
          }

          $cfg | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

      - name: Deploy a MonsterASP.NET vía Web Deploy
        # Action recomendada por la documentación de MonsterASP para Web Deploy.
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.MONSTERASP_WEBSITE }}          # site81000
          server-computer-name: ${{ secrets.MONSTERASP_SERVER }}   # https://site81000.siteasp.net:8172
          server-username: ${{ secrets.MONSTERASP_USERNAME }}      # site81000
          server-password: ${{ secrets.MONSTERASP_PASSWORD }}
