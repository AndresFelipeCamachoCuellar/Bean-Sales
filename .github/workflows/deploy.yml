name: Build, publish and deploy to MonsterASP.NET

# Despliegue continuo hacia MonsterASP.NET (site81000 / kingbean.runasp.net) vía Web Deploy (MSDeploy).
# Método oficial documentado por MonsterASP:
#   https://help.monsterasp.net/books/github/page/how-to-deploy-website-via-github-actions
#
# Se dispara al hacer push a `dev` o `master`, y también manualmente desde la
# pestaña Actions de GitHub (workflow_dispatch).
#
# IMPORTANTE: MonsterASP corre el app pool en 32 bits (.NET [x86]), por eso se
# publica con --runtime win-x86. La connection string de producción se inyecta
# en tiempo de build desde el secret MONSTERASP_CONNECTION_STRING (nunca vive en el repo).

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    # Debe ser Windows: el deploy usa Microsoft Web Deploy (MSDeploy), que solo corre en Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias (RID win-x86)
        run: dotnet restore Web/Web.csproj -r win-x86

      - name: Publicar (Release, framework-dependent x86)
        # win-x86 porque MonsterASP usa app pool de 32 bits. Framework-dependent
        # (--self-contained false) porque el host ya trae el runtime de .NET 10.
        # Salida ./publish = source-path por defecto de la action de deploy.
        run: dotnet publish Web/Web.csproj -c Release -o ./publish --runtime win-x86 --self-contained false --no-restore

      - name: Inyectar connection string de producción
        # Sobrescribe SOLO la DefaultConnection dentro del appsettings.json publicado,
        # tomando el valor del secret (no se commitea nunca). Se modifica el base
        # appsettings.json para que aplique sin depender del entorno del host.
        shell: pwsh
        env:
          PROD_CS: ${{ secrets.MONSTERASP_CONNECTION_STRING }}
        run: |
          $path = "./publish/appsettings.json"
          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $cfg.ConnectionStrings.DefaultConnection = $env:PROD_CS
          $cfg | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          Write-Host "Connection string de producción inyectada en appsettings.json."

      - name: Deploy a MonsterASP.NET vía Web Deploy
        # Action recomendada por la documentación de MonsterASP para Web Deploy.
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.MONSTERASP_WEBSITE }}          # site81000
          server-computer-name: ${{ secrets.MONSTERASP_SERVER }}   # https://site81000.siteasp.net:8172
          server-username: ${{ secrets.MONSTERASP_USERNAME }}      # site81000
          server-password: ${{ secrets.MONSTERASP_PASSWORD }}
